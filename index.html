<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StudyLens turns your study sessions into a living visual map of everything you’ve accomplished."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;0,9..144,640;1,9..144,400;1,9..144,560&family=Outfit:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>StudyLens — Every effort leaves a mark.</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('studylens_appearance')
          if (theme !== 'dark' && theme !== 'light') theme = 'light'
          document.documentElement.setAttribute('data-theme', theme)
          document.documentElement.style.colorScheme = theme
          var language = localStorage.getItem('studylens_language')
          if (language === 'zh-CN' || language === 'zh-Hans') language = 'zh'
          if (language === 'en-US' || language === 'en-GB') language = 'en'
          if (language !== 'zh' && language !== 'en') language = 'en'
          document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en-US'
          document.documentElement.setAttribute('data-lang', language)
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
          document.documentElement.style.colorScheme = 'light'
          document.documentElement.lang = 'en-US'
          document.documentElement.setAttribute('data-lang', 'en')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
